# ============================================================
# HAMZA SAADOUNA PORTFOLIO — SPRING BOOT CONFIGURATION
# ============================================================

server.port=8080

# ---- Mail Configuration (Gmail SMTP) ----
# IMPORTANT: Use an App Password, not your real Gmail password.
# Steps to generate:
#   1. Go to https://myaccount.google.com/security
#   2. Enable 2-Step Verification
#   3. Go to App Passwords → generate one for "Mail"
#   4. Use that 16-character password below

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS@gmail.com
spring.mail.password=YOUR_APP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ---- Portfolio Settings ----
portfolio.contact.recipient-email=saadouna.hamzaaa@gmail.com

# ---- CORS ----
# Update this to your Angular dev server or production domain
spring.web.cors.allowed-origins=http://localhost:4200,https://hamzasaadouna.dev,http://localhost:6218

# ---- Logging ----
logging.level.com.hamzasaadouna=INFO
logging.level.org.springframework.mail=DEBUG
